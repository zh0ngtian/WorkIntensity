<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work Intensity</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(180deg, #f8fafc 0%, #f3f4f6 100%); color: #111827; }
    .container { height: 100%; display: grid; grid-template-rows: 2fr 1fr; gap: 14px; padding: 14px; box-sizing: border-box; }
    .panel { border: 1px solid rgba(226, 232, 240, 0.9); border-radius: 16px; padding: 14px; box-sizing: border-box; background: rgba(255, 255, 255, 0.9); box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06); backdrop-filter: blur(6px); }
    .subtitle { font-size: 12px; color: #6b7280; margin: 0; }
    .top { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; height: 100%; }
    .bottom { display: grid; grid-template-rows: 1fr; height: 100%; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .metrics { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .metric { min-width: 86px; padding: 8px 10px; border-radius: 12px; background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%); border: 1px solid rgba(199, 210, 254, 0.7); }
    .metric-token { background: linear-gradient(180deg, #fff7fb 0%, #fce7f3 100%); border-color: rgba(251, 207, 232, 0.9); }
    .metric-token .metric-value { color: #9d174d; }
    .metric-label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .metric-value { font-size: 16px; font-weight: 700; color: #111827; }
    #contrib { width: 100%; height: 100%; }
    #bars { width: 100%; height: 100%; }
    .legend { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #6b7280; font-size: 12px; }
    .legend-scale { display: flex; align-items: center; gap: 6px; }
    .legend-note { color: #9ca3af; }
    .legend .box { width: 12px; height: 12px; border-radius: 4px; border: 1px solid rgba(27, 31, 35, 0.04); }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="top">
        <div class="section-head">
          <div>
            <p class="subtitle">按天展示近半年活跃时长分布，颜色越深表示当天越活跃。iCloud 备份：__ICLOUD_BACKUP_TIME__</p>
          </div>
          <div class="metrics">
            <div class="metric">
              <div class="metric-label">工作日日均时长</div>
              <div class="metric-value">__AVERAGE_DAILY_WORK__h</div>
            </div>
            <div class="metric">
              <div class="metric-label">单日峰值</div>
              <div class="metric-value">__PEAK_DAILY_WORK__h</div>
            </div>
            <div class="metric">
              <div class="metric-label">今日时长</div>
              <div class="metric-value">__TODAY_WORK__h</div>
            </div>
            <div class="metric metric-token">
              <div class="metric-label">工作日日均 Token</div>
              <div class="metric-value">__AVERAGE_DAILY_TOKENS__</div>
            </div>
            <div class="metric metric-token">
              <div class="metric-label">Token 单日峰值</div>
              <div class="metric-value">__PEAK_DAILY_TOKENS__</div>
            </div>
            <div class="metric metric-token">
              <div class="metric-label">今日 Token</div>
              <div class="metric-value">__TODAY_TOKENS__</div>
            </div>
          </div>
        </div>
        <div id="contrib"></div>
        <div class="legend">
          <div class="legend-scale">
            <span>少</span>
            <span class="box" style="background:#f3f6f9"></span>
            <span class="box" style="background:#d6ebd8"></span>
            <span class="box" style="background:#9fd3a9"></span>
            <span class="box" style="background:#4faa72"></span>
            <span class="box" style="background:#1f7a4d"></span>
            <span>多</span>
          </div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="bottom">
        <div id="bars"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script>
    const contribEl = document.getElementById('contrib');
    const barsEl = document.getElementById('bars');
    const contribChart = echarts.init(contribEl);
    const barsChart = echarts.init(barsEl);

    const weekRanges = __WEEK_RANGES_JSON__;
    const ylabels = __YLABELS_JSON__;
    const startDateStr = __START_DATE_STR_JSON__;
    const startDate = new Date(startDateStr + 'T00:00:00');
    const currentLocalDateStr = __CURRENT_LOCAL_DATE_STR_JSON__;
    const currentLocalHour = __CURRENT_LOCAL_HOUR__;
    const heatmapData = __HEATMAP_DATA_JSON__.map((d) => {
      const x = d[0];
      const y = d[1];
      const v = d[2];
      const hourly = d[3] || [];
      const tokenTotal = d[6] || 0;
      const hourlyTokens = d[7] || [];
      const projectTokens = d[8] || [];
      return {
        value: [x, y, v],
        date: d[4],
        weekday: d[5],
        hourly,
        tokenTotal,
        hourlyTokens,
        projectTokens
      };
    });
    const weeks = Array.from({length: weekRanges.length}, (_, i) => i);
    const monthLabels = weeks.map((weekIndex) => {
      const date = new Date(startDate.getTime() + weekIndex * 7 * 24 * 3600 * 1000);
      const month = date.getMonth() + 1;
      return `${month}月`;
    });

    function formatTokenCount(value) {
      const n = Number(value) || 0;
      if (n >= 1000000000) return `${(n / 1000000000).toFixed(1)}B`;
      if (n >= 1000000) return `${(n / 1000000).toFixed(1)}M`;
      if (n >= 1000) return `${(n / 1000).toFixed(1)}K`;
      return `${Math.round(n)}`;
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function shortenProjectName(value) {
      const text = String(value || 'unknown');
      return text.length > 22 ? `${text.slice(0, 19)}...` : text;
    }

    function pieSlicePath(cx, cy, r, startAngle, endAngle) {
      const startX = cx + Math.cos(startAngle) * r;
      const startY = cy + Math.sin(startAngle) * r;
      const endX = cx + Math.cos(endAngle) * r;
      const endY = cy + Math.sin(endAngle) * r;
      const largeArc = endAngle - startAngle > Math.PI ? 1 : 0;
      return `M ${cx} ${cy} L ${startX.toFixed(2)} ${startY.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${endX.toFixed(2)} ${endY.toFixed(2)} Z`;
    }

    function dailyProjectPieSvg(projectTokens) {
      const rows = (projectTokens || [])
        .map((item) => ({
          project: item.project || 'unknown',
          tokens: Math.max(0, Number(item.tokens) || 0)
        }))
        .filter((item) => item.tokens > 0);
      const total = rows.reduce((sum, item) => sum + item.tokens, 0);
      if (!total) {
        return `<div style="width: 560px; box-sizing: border-box; padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 8px; color: #9ca3af; background: #fff;">暂无项目 Token 明细</div>`;
      }

      const colors = ['#db2777', '#2563eb', '#16a34a', '#f59e0b', '#7c3aed', '#0891b2', '#dc2626', '#4b5563', '#65a30d', '#c026d3'];
      const w = 560;
      const rowH = 22;
      const h = Math.max(156, rows.length * rowH + 26);
      const cx = 76;
      const cy = h / 2 + 6;
      const r = 52;
      let angle = -Math.PI / 2;

      const slices = rows.map((item, index) => {
        const sliceAngle = (item.tokens / total) * Math.PI * 2;
        const color = colors[index % colors.length];
        if (sliceAngle >= Math.PI * 2 - 0.0001) {
          return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"></circle>`;
        }
        const path = pieSlicePath(cx, cy, r, angle, angle + sliceAngle);
        angle += sliceAngle;
        return `<path d="${path}" fill="${color}" stroke="#fff" stroke-width="1.5"></path>`;
      }).join('');

      const legend = rows.map((item, index) => {
        const color = colors[index % colors.length];
        const y = 34 + index * rowH;
        const percent = ((item.tokens / total) * 100).toFixed(1);
        const label = escapeHtml(shortenProjectName(item.project));
        const fullLabel = escapeHtml(item.project);
        return `<g>
          <title>${fullLabel}: ${formatTokenCount(item.tokens)} (${percent}%)</title>
          <rect x="150" y="${y - 10}" width="10" height="10" rx="2" fill="${color}"></rect>
          <text x="168" y="${y}" font-size="12" fill="#374151">${label}</text>
          <text x="${w - 10}" y="${y}" text-anchor="end" font-size="12" fill="#6b7280">${formatTokenCount(item.tokens)} · ${percent}%</text>
        </g>`;
      }).join('');

      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="${w}" height="${h}" rx="8" fill="#ffffff"></rect>
        <text x="12" y="20" font-size="12" font-weight="700" fill="#111827">项目 Token 占比</text>
        ${slices}
        <circle cx="${cx}" cy="${cy}" r="22" fill="#fff"></circle>
        <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">${formatTokenCount(total)}</text>
        <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="10" fill="#6b7280">total</text>
        ${legend}
      </svg>`;
    }

    function formatTokenAxisValue(value) {
      const scale = trendTokenAxisScale || {};
      const maxValue = Math.max(0, Number(scale.maxValue) || 0);
      const segmentCount = Math.max(1, Number(scale.segmentCount) || 1);
      if (maxValue <= 0) return '0';
      const axisMax = Math.max(1, Number(scale.axisMax) || 1);
      const n = Math.max(0, Math.min(axisMax, Number(value) || 0));
      const segmentWidth = maxValue / segmentCount;
      let axisStart = 0;
      for (let index = 0; index < segmentCount; index += 1) {
        const segmentHeight = segmentCount - index;
        const axisEnd = axisStart + segmentHeight;
        if (n <= axisEnd || index === segmentCount - 1) {
          const ratio = Math.max(0, Math.min(1, (n - axisStart) / segmentHeight));
          return formatTokenCount(segmentWidth * (index + ratio));
        }
        axisStart = axisEnd;
      }
      return formatTokenCount(maxValue);
    }

    function dailySparklineSvg(activityValues, tokenValues, dateStr) {
      const w = 560;
      const h = 212;
      const leftPad = 46;
      const rightPad = 58;
      const topPad = 16;
      const plotH = 120;
      const plotW = w - leftPad - rightPad;
      const maxV = 100;
      const clamp = (n) => Math.max(0, Math.min(maxV, Number(n) || 0));
      const activityFull = (activityValues && activityValues.length ? activityValues : Array.from({length: 24}, () => 0));
      const tokenFull = (tokenValues && tokenValues.length ? tokenValues : Array.from({length: 24}, () => 0));
      const startHour = 0;
      const endHour = 24;
      const visibleEndHour = dateStr === currentLocalDateStr ? Math.min(endHour, currentLocalHour + 1) : endHour;
      const activitySliced = activityFull.slice(startHour, visibleEndHour);
      const tokenSliced = tokenFull.slice(startHour, visibleEndHour).map((v) => Math.max(0, Number(v) || 0));
      const maxToken = Math.max(1, ...tokenSliced);
      const fullIntervalCount = Math.max(1, endHour - startHour);
      const buildPath = (pointPairs) => pointPairs.length <= 1
        ? ''
        : pointPairs.reduce((path, point, index, points) => {
            const [x, y] = point;
            if (index === 0) {
              return `M ${x.toFixed(1)} ${y.toFixed(1)}`;
            }
            const [prevX, prevY] = points[index - 1];
            const cp1X = prevX + (x - prevX) / 3;
            const cp1Y = prevY;
            const cp2X = x - (x - prevX) / 3;
            const cp2Y = y;
            return `${path} C ${cp1X.toFixed(1)} ${cp1Y.toFixed(1)}, ${cp2X.toFixed(1)} ${cp2Y.toFixed(1)}, ${x.toFixed(1)} ${y.toFixed(1)}`;
          }, '');
      const activityPoints = activitySliced.map((v, i) => {
        const x = leftPad + ((i + 0.5) / fullIntervalCount) * plotW;
        const y = topPad + (1 - clamp(v) / maxV) * plotH;
        return [x, y];
      });
      const tokenPoints = tokenSliced.map((v, i) => {
        const x = leftPad + ((i + 0.5) / fullIntervalCount) * plotW;
        const y = topPad + (1 - v / maxToken) * plotH;
        return [x, y];
      });
      const activityPath = buildPath(activityPoints);
      const tokenPath = buildPath(tokenPoints);
      const yTicks = [0, 25, 50, 75, 100].map((t) => {
        const y = topPad + (1 - t / 100) * plotH;
        return `<g>
          <line x1="${leftPad}" y1="${y}" x2="${w - rightPad}" y2="${y}" stroke="#e5e7eb" stroke-width="1" />
          <text x="${leftPad - 8}" y="${y + 4}" text-anchor="end" font-size="12" fill="#6b7280">${t}%</text>
        </g>`;
      }).join('');
      const tokenTicks = [0, 0.5, 1].map((ratio) => {
        const y = topPad + (1 - ratio) * plotH;
        return `<text x="${w - rightPad + 8}" y="${y + 4}" text-anchor="start" font-size="12" fill="#9d174d">${formatTokenCount(maxToken * ratio)}</text>`;
      }).join('');
      const xTickHours = [0, 4, 8, 12, 16, 20, 24];
      const xTicks = xTickHours.map((t) => {
        const i = (t - startHour);
        const x = leftPad + (i / fullIntervalCount) * plotW;
        return `<text x="${x}" y="${topPad + plotH + 28}" text-anchor="middle" font-size="12" fill="#6b7280">${t === 24 ? '24' : String(t).padStart(2, '0')}</text>`;
      }).join('');
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="${w}" height="${h}" rx="8" fill="#ffffff"></rect>
        ${yTicks}
        ${tokenTicks}
        <path d="${activityPath}" fill="none" stroke="#31a354" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="${tokenPath}" fill="none" stroke="#db2777" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="${leftPad + 6}" cy="${topPad + plotH + 52}" r="4" fill="#31a354"></circle>
        <text x="${leftPad + 16}" y="${topPad + plotH + 56}" font-size="12" fill="#374151">活跃度</text>
        <circle cx="${leftPad + 82}" cy="${topPad + plotH + 52}" r="4" fill="#db2777"></circle>
        <text x="${leftPad + 92}" y="${topPad + plotH + 56}" font-size="12" fill="#374151">Token 用量</text>
        ${xTicks}
      </svg>`;
    }

    function dailyTooltipHtml(date, weekday, workHours, hourly, hourlyTokens, projectTokens) {
      const dailySvg = dailySparklineSvg(hourly, hourlyTokens, date);
      const projectPieSvg = dailyProjectPieSvg(projectTokens);
      return `<div style="min-width: 580px;">
        <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom: 8px;">
          <div style="font-size: 14px; font-weight: 700;">${date} ${weekday}</div>
          <div style="display:flex; align-items:baseline; gap:12px;">
            <div style="font-size: 18px; font-weight: 800; color: #166534;">${workHours}h</div>
          </div>
        </div>
        <div style="margin-bottom: 6px;">${dailySvg}</div>
        <div style="margin-bottom: 6px;">${projectPieSvg}</div>
        <div style="font-size: 12px; color: #6b7280;">活跃度 / Token 用量趋势（00:00-24:00）</div>
      </div>`;
    }

    const contribBaseOption = {
      tooltip: {
        position: 'top',
        confine: true,
        backgroundColor: 'rgba(255, 255, 255, 0.98)',
        borderColor: '#dbe4ee',
        borderWidth: 1,
        extraCssText: 'box-shadow: 0 18px 36px rgba(15,23,42,0.12); padding: 12px; border-radius: 14px;',
        formatter: (p) => {
          const date = p.data && p.data.date ? p.data.date : '';
          const weekday = p.data && p.data.weekday ? p.data.weekday : '';
          const hourly = p.data && p.data.hourly ? p.data.hourly : [];
          const hourlyTokens = p.data && p.data.hourlyTokens ? p.data.hourlyTokens : [];
          const projectTokens = p.data && p.data.projectTokens ? p.data.projectTokens : [];
          const value = p.value && p.value.length ? p.value[2] : 0;
          return dailyTooltipHtml(date, weekday, value, hourly, hourlyTokens, projectTokens);
        }
      },
      xAxis: {
        type: 'category',
        data: weeks,
        position: 'top',
        axisTick: { show: false },
        axisLine: { show: false },
        splitLine: { show: false },
        axisLabel: {
          interval: 0,
          fontSize: 14,
          fontWeight: 600,
          color: '#6b7280',
          margin: 10,
          formatter: (value) => {
            if (value === 0) return monthLabels[0];
            return monthLabels[value] !== monthLabels[value - 1] ? monthLabels[value] : '';
          }
        }
      },
      yAxis: {
        type: 'category',
        data: ylabels,
        inverse: true,
        axisTick: { show: false },
        axisLine: { show: false },
        splitLine: { show: false },
        axisLabel: {
          fontSize: 13,
          fontWeight: 600,
          color: '#6b7280',
          interval: 0,
          margin: 12
        }
      },
      visualMap: {
        type: 'piecewise',
        show: false,
        pieces: [
          { lte: 0, color: '#f3f6f9' },
          { gt: 0, lte: 2, color: '#d6ebd8' },
          { gt: 2, lte: 4, color: '#9fd3a9' },
          { gt: 4, lte: 6, color: '#4faa72' },
          { gt: 6, color: '#1f7a4d' },
        ]
      },
      series: [{
        type: 'heatmap',
        data: heatmapData,
        label: {
          show: true,
          fontSize: 12,
          fontWeight: 700,
          formatter: (p) => {
            const v = p.value && p.value.length ? p.value[2] : null;
            if (v === null || v === undefined || v <= 0) return '';
            const hourText = `${v}h`;
            if (v <= 2) return `{soft|${hourText}}`;
            if (v <= 4) return `{mid|${hourText}}`;
            return `{light|${hourText}}`;
          },
          rich: {
            soft: {
              color: '#4b5563',
              fontSize: 12,
              fontWeight: 700
            },
            mid: {
              color: '#1f2937',
              fontSize: 12,
              fontWeight: 700
            },
            light: {
              color: 'rgba(255,255,255,0.92)',
              fontSize: 12,
              fontWeight: 700,
              textShadowColor: 'rgba(15, 23, 42, 0.18)',
              textShadowBlur: 6
            }
          }
        },
        itemStyle: {
          borderWidth: 3,
          borderColor: 'rgba(255,255,255,0.95)',
          borderRadius: 7,
          shadowBlur: 0,
          shadowColor: 'rgba(15, 23, 42, 0.08)'
        },
        emphasis: {
          itemStyle: {
            borderColor: '#0f172a',
            borderWidth: 2,
            shadowBlur: 18,
            shadowColor: 'rgba(15, 23, 42, 0.18)'
          }
        }
      }]
    };

    function renderContribChart() {
      const width = contribEl.clientWidth || 960;
      const height = contribEl.clientHeight || 420;
      const leftPadding = 64;
      const rightPadding = 18;
      const topPadding = 40;
      const bottomPadding = 20;
      const plotMaxWidth = Math.max(0, width - leftPadding - rightPadding);
      const plotMaxHeight = Math.max(0, height - topPadding - bottomPadding);
      const cellSize = Math.max(10, Math.floor(Math.min(plotMaxWidth / weeks.length, plotMaxHeight / ylabels.length)));
      const gridWidth = cellSize * weeks.length;
      const gridHeight = cellSize * ylabels.length;
      const gridLeft = leftPadding + Math.max(0, Math.floor((plotMaxWidth - gridWidth) / 2));
      const gridTop = topPadding + Math.max(0, Math.floor((plotMaxHeight - gridHeight) / 2));
      contribChart.setOption({
        ...contribBaseOption,
        grid: {
          left: gridLeft,
          top: gridTop,
          width: gridWidth,
          height: gridHeight,
          containLabel: false
        }
      });
    }

    renderContribChart();

    const trendLabels = __TREND_LABELS_JSON__;
    const trendValues = __TREND_VALUES_JSON__;
    const trendTokenValues = __TREND_TOKEN_VALUES_JSON__;
    const trendHourlyValues = __TREND_HOURLY_VALUES_JSON__;
    const trendHourlyTokenValues = __TREND_HOURLY_TOKEN_VALUES_JSON__;
    const trendProjectTokenValues = __TREND_PROJECT_TOKEN_VALUES_JSON__;
    const trendTokenAxisScale = __TREND_TOKEN_AXIS_SCALE_JSON__;
    const trendTokenAxisValues = trendTokenAxisScale.values || trendTokenValues.map(() => 0);
    const trendDates = __TREND_DATES_JSON__;
    const trendWeekdays = __TREND_WEEKDAYS_JSON__;
    const trendSeriesData = trendValues.map((value, index) => ({
      value,
      date: trendDates[index],
      weekday: trendWeekdays[index],
      projectTokens: trendProjectTokenValues[index] || []
    }));
    const trendTokenSeriesData = trendTokenValues.map((value, index) => ({
      value: trendTokenAxisValues[index] || 0,
      rawValue: value,
      date: trendDates[index],
      weekday: trendWeekdays[index],
      projectTokens: trendProjectTokenValues[index] || []
    }));
    const trendTokenAxisMax = Math.max(1, Number(trendTokenAxisScale.axisMax) || 1);

    barsChart.setOption({
      legend: {
        top: 0,
        right: 20,
        data: ['工作时长', 'Token 用量']
      },
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'line',
          snap: true
        },
        formatter: (params) => {
          const items = params || [];
          const item = items.length ? items[0] : null;
          if (!item) return '';
          const data = item.data || {};
          const index = item.dataIndex;
          const date = data.date || trendDates[item.dataIndex] || item.axisValue;
          const weekday = data.weekday || trendWeekdays[item.dataIndex] || '';
          const workHours = trendValues[index] || 0;
          const hourly = trendHourlyValues[index] || [];
          const hourlyTokens = trendHourlyTokenValues[index] || [];
          const projectTokens = trendProjectTokenValues[index] || [];
          return dailyTooltipHtml(date, weekday, workHours, hourly, hourlyTokens, projectTokens);
        }
      },
      grid: { top: 28, left: 50, right: 58, bottom: 50 },
      xAxis: {
        type: 'category',
        data: trendLabels,
        boundaryGap: false,
        axisLabel: {
          interval: Math.max(0, Math.floor(trendLabels.length / 10) - 1),
          fontSize: 12
        }
      },
      yAxis: [
        {
          type: 'value',
          min: 0,
          max: __TREND_Y_MAX__,
          axisLabel: {
            formatter: '{value}h',
            fontSize: 12
          },
          splitLine: {
            lineStyle: {
              color: '#e5e7eb'
            }
          }
        },
        {
          type: 'value',
          min: 0,
          max: trendTokenAxisMax,
          splitNumber: Math.max(1, Number(trendTokenAxisScale.segmentCount) || 1),
          axisLabel: {
            formatter: (value) => formatTokenAxisValue(value),
            fontSize: 12
          },
          splitLine: {
            show: false
          }
        }
      ],
      series: [{
        name: '工作时长',
        type: 'line',
        smooth: true,
        data: trendSeriesData,
        triggerLineEvent: true,
        showSymbol: true,
        symbol: 'circle',
        symbolSize: 8,
        lineStyle: { color: '#31a354', width: 3 },
        itemStyle: { color: '#31a354' },
        emphasis: {
          focus: 'series',
          scale: true
        },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(49, 163, 84, 0.35)' },
            { offset: 1, color: 'rgba(49, 163, 84, 0.05)' }
          ])
        }
      }, {
        name: 'Token 用量',
        type: 'line',
        yAxisIndex: 1,
        smooth: true,
        data: trendTokenSeriesData,
        showSymbol: true,
        symbol: 'circle',
        symbolSize: 7,
        lineStyle: { color: '#db2777', width: 2.5 },
        itemStyle: { color: '#db2777' },
        emphasis: {
          focus: 'series',
          scale: true
        }
      }]
    });

    window.addEventListener('resize', () => {
      contribChart.resize();
      renderContribChart();
      barsChart.resize();
    });
  </script>
</body>
</html>
