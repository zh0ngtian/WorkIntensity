<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work Intensity</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(180deg, #f8fafc 0%, #f3f4f6 100%); color: #111827; }
    .container { height: 100%; display: grid; grid-template-rows: 2fr 1fr; gap: 14px; padding: 14px; box-sizing: border-box; }
    .panel { border: 1px solid rgba(226, 232, 240, 0.9); border-radius: 16px; padding: 14px; box-sizing: border-box; background: rgba(255, 255, 255, 0.9); box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06); backdrop-filter: blur(6px); }
    .title { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
    .subtitle { font-size: 12px; color: #6b7280; margin: 4px 0 0 0; }
    .top { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; height: 100%; }
    .bottom { display: grid; grid-template-rows: auto 1fr; gap: 8px; height: 100%; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .metrics { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .metric { min-width: 86px; padding: 8px 10px; border-radius: 12px; background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%); border: 1px solid rgba(199, 210, 254, 0.7); }
    .metric-label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .metric-value { font-size: 16px; font-weight: 700; color: #111827; }
    #contrib { width: 100%; height: 100%; }
    #bars { width: 100%; height: 100%; }
    .legend { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #6b7280; font-size: 12px; }
    .legend-scale { display: flex; align-items: center; gap: 6px; }
    .legend-note { color: #9ca3af; }
    .legend .box { width: 12px; height: 12px; border-radius: 4px; border: 1px solid rgba(27, 31, 35, 0.04); }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="top">
        <div class="section-head">
          <div>
            <p class="title">最近 __WEEK_NUMBER__ 周工作时长</p>
            <p class="subtitle">按天展示近半年活跃时长分布，颜色越深表示当天越活跃。</p>
          </div>
          <div class="metrics">
            <div class="metric">
              <div class="metric-label">工作日日均时长</div>
              <div class="metric-value">__AVERAGE_DAILY_WORK__h</div>
            </div>
            <div class="metric">
              <div class="metric-label">单日峰值</div>
              <div class="metric-value">__PEAK_DAILY_WORK__h</div>
            </div>
            <div class="metric">
              <div class="metric-label">今日时长</div>
              <div class="metric-value">__TODAY_WORK__h</div>
            </div>
          </div>
        </div>
        <div id="contrib"></div>
        <div class="legend">
          <div class="legend-scale">
            <span>少</span>
            <span class="box" style="background:#f3f6f9"></span>
            <span class="box" style="background:#d6ebd8"></span>
            <span class="box" style="background:#9fd3a9"></span>
            <span class="box" style="background:#4faa72"></span>
            <span class="box" style="background:#1f7a4d"></span>
            <span>多</span>
          </div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="bottom">
        <p class="title">最近 __TREND_WEEKS__ 周每日工作时长趋势</p>
        <div id="bars"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script>
    const contribEl = document.getElementById('contrib');
    const barsEl = document.getElementById('bars');
    const contribChart = echarts.init(contribEl);
    const barsChart = echarts.init(barsEl);

    const weekRanges = __WEEK_RANGES_JSON__;
    const ylabels = __YLABELS_JSON__;
    const startDateStr = __START_DATE_STR_JSON__;
    const startDate = new Date(startDateStr + 'T00:00:00');
    const currentLocalDateStr = __CURRENT_LOCAL_DATE_STR_JSON__;
    const currentLocalHour = __CURRENT_LOCAL_HOUR__;
    const heatmapData = __HEATMAP_DATA_JSON__.map((d) => {
      const x = d[0];
      const y = d[1];
      const v = d[2];
      const hourly = d[3] || [];
      const tokenTotal = d[6] || 0;
      const hourlyTokens = d[7] || [];
      return {
        value: [x, y, v],
        date: d[4],
        weekday: d[5],
        hourly,
        tokenTotal,
        hourlyTokens
      };
    });
    const weeks = Array.from({length: weekRanges.length}, (_, i) => i);
    const monthLabels = weeks.map((weekIndex) => {
      const date = new Date(startDate.getTime() + weekIndex * 7 * 24 * 3600 * 1000);
      const month = date.getMonth() + 1;
      return `${month}月`;
    });

    function formatTokenCount(value) {
      const n = Number(value) || 0;
      if (n >= 1000000000) return `${(n / 1000000000).toFixed(1)}B`;
      if (n >= 1000000) return `${(n / 1000000).toFixed(1)}M`;
      if (n >= 1000) return `${(n / 1000).toFixed(1)}K`;
      return `${Math.round(n)}`;
    }

    function dailySparklineSvg(activityValues, tokenValues, dateStr) {
      const w = 560;
      const h = 212;
      const leftPad = 46;
      const rightPad = 58;
      const topPad = 16;
      const plotH = 120;
      const plotW = w - leftPad - rightPad;
      const maxV = 100;
      const clamp = (n) => Math.max(0, Math.min(maxV, Number(n) || 0));
      const activityFull = (activityValues && activityValues.length ? activityValues : Array.from({length: 24}, () => 0));
      const tokenFull = (tokenValues && tokenValues.length ? tokenValues : Array.from({length: 24}, () => 0));
      const startHour = 0;
      const endHour = 24;
      const visibleEndHour = dateStr === currentLocalDateStr ? Math.min(endHour, currentLocalHour + 1) : endHour;
      const activitySliced = activityFull.slice(startHour, visibleEndHour);
      const tokenSliced = tokenFull.slice(startHour, visibleEndHour).map((v) => Math.max(0, Number(v) || 0));
      const maxToken = Math.max(1, ...tokenSliced);
      const fullIntervalCount = Math.max(1, endHour - startHour);
      const buildPath = (pointPairs) => pointPairs.length <= 1
        ? ''
        : pointPairs.reduce((path, point, index, points) => {
            const [x, y] = point;
            if (index === 0) {
              return `M ${x.toFixed(1)} ${y.toFixed(1)}`;
            }
            const [prevX, prevY] = points[index - 1];
            const cp1X = prevX + (x - prevX) / 3;
            const cp1Y = prevY;
            const cp2X = x - (x - prevX) / 3;
            const cp2Y = y;
            return `${path} C ${cp1X.toFixed(1)} ${cp1Y.toFixed(1)}, ${cp2X.toFixed(1)} ${cp2Y.toFixed(1)}, ${x.toFixed(1)} ${y.toFixed(1)}`;
          }, '');
      const activityPoints = activitySliced.map((v, i) => {
        const x = leftPad + ((i + 0.5) / fullIntervalCount) * plotW;
        const y = topPad + (1 - clamp(v) / maxV) * plotH;
        return [x, y];
      });
      const tokenPoints = tokenSliced.map((v, i) => {
        const x = leftPad + ((i + 0.5) / fullIntervalCount) * plotW;
        const y = topPad + (1 - v / maxToken) * plotH;
        return [x, y];
      });
      const activityPath = buildPath(activityPoints);
      const tokenPath = buildPath(tokenPoints);
      const yTicks = [0, 25, 50, 75, 100].map((t) => {
        const y = topPad + (1 - t / 100) * plotH;
        return `<g>
          <line x1="${leftPad}" y1="${y}" x2="${w - rightPad}" y2="${y}" stroke="#e5e7eb" stroke-width="1" />
          <text x="${leftPad - 8}" y="${y + 4}" text-anchor="end" font-size="12" fill="#6b7280">${t}%</text>
        </g>`;
      }).join('');
      const tokenTicks = [0, 0.5, 1].map((ratio) => {
        const y = topPad + (1 - ratio) * plotH;
        return `<text x="${w - rightPad + 8}" y="${y + 4}" text-anchor="start" font-size="12" fill="#9d174d">${formatTokenCount(maxToken * ratio)}</text>`;
      }).join('');
      const xTickHours = [0, 4, 8, 12, 16, 20, 24];
      const xTicks = xTickHours.map((t) => {
        const i = (t - startHour);
        const x = leftPad + (i / fullIntervalCount) * plotW;
        return `<text x="${x}" y="${topPad + plotH + 28}" text-anchor="middle" font-size="12" fill="#6b7280">${t === 24 ? '24' : String(t).padStart(2, '0')}</text>`;
      }).join('');
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="${w}" height="${h}" rx="8" fill="#ffffff"></rect>
        ${yTicks}
        ${tokenTicks}
        <path d="${activityPath}" fill="none" stroke="#31a354" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="${tokenPath}" fill="none" stroke="#db2777" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="${leftPad + 6}" cy="${topPad + plotH + 52}" r="4" fill="#31a354"></circle>
        <text x="${leftPad + 16}" y="${topPad + plotH + 56}" font-size="12" fill="#374151">活跃度</text>
        <circle cx="${leftPad + 82}" cy="${topPad + plotH + 52}" r="4" fill="#db2777"></circle>
        <text x="${leftPad + 92}" y="${topPad + plotH + 56}" font-size="12" fill="#374151">Token 用量</text>
        ${xTicks}
      </svg>`;
    }

    const contribBaseOption = {
      tooltip: {
        position: 'top',
        confine: true,
        backgroundColor: 'rgba(255, 255, 255, 0.98)',
        borderColor: '#dbe4ee',
        borderWidth: 1,
        extraCssText: 'box-shadow: 0 18px 36px rgba(15,23,42,0.12); padding: 12px; border-radius: 14px;',
        formatter: (p) => {
          const date = p.data && p.data.date ? p.data.date : '';
          const weekday = p.data && p.data.weekday ? p.data.weekday : '';
          const hourly = p.data && p.data.hourly ? p.data.hourly : [];
          const hourlyTokens = p.data && p.data.hourlyTokens ? p.data.hourlyTokens : [];
          const tokenTotal = p.data && p.data.tokenTotal ? p.data.tokenTotal : 0;
          const value = p.value && p.value.length ? p.value[2] : 0;
          const dailySvg = dailySparklineSvg(hourly, hourlyTokens, date);
          return `<div style="min-width: 580px;">
            <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom: 8px;">
              <div style="font-size: 14px; font-weight: 700;">${date} ${weekday}</div>
              <div style="display:flex; align-items:baseline; gap:12px;">
                <div style="font-size: 18px; font-weight: 800; color: #166534;">${value}h</div>
                <div style="font-size: 18px; font-weight: 800; color: #db2777;">${formatTokenCount(tokenTotal)}</div>
              </div>
            </div>
            <div style="margin-bottom: 6px;">${dailySvg}</div>
            <div style="font-size: 12px; color: #6b7280;">活跃度 / Token 用量趋势（00:00-24:00）</div>
          </div>`;
        }
      },
      xAxis: {
        type: 'category',
        data: weeks,
        position: 'top',
        axisTick: { show: false },
        axisLine: { show: false },
        splitLine: { show: false },
        axisLabel: {
          interval: 0,
          fontSize: 14,
          fontWeight: 600,
          color: '#6b7280',
          margin: 10,
          formatter: (value) => {
            if (value === 0) return monthLabels[0];
            return monthLabels[value] !== monthLabels[value - 1] ? monthLabels[value] : '';
          }
        }
      },
      yAxis: {
        type: 'category',
        data: ylabels,
        inverse: true,
        axisTick: { show: false },
        axisLine: { show: false },
        splitLine: { show: false },
        axisLabel: {
          fontSize: 13,
          fontWeight: 600,
          color: '#6b7280',
          interval: 0,
          margin: 12
        }
      },
      visualMap: {
        type: 'piecewise',
        show: false,
        pieces: [
          { lte: 0, color: '#f3f6f9' },
          { gt: 0, lte: 2, color: '#d6ebd8' },
          { gt: 2, lte: 4, color: '#9fd3a9' },
          { gt: 4, lte: 6, color: '#4faa72' },
          { gt: 6, color: '#1f7a4d' },
        ]
      },
      series: [{
        type: 'heatmap',
        data: heatmapData,
        label: {
          show: true,
          fontSize: 12,
          fontWeight: 700,
          formatter: (p) => {
            const v = p.value && p.value.length ? p.value[2] : null;
            if (v === null || v === undefined || v <= 0) return '';
            const hourText = `${v}h`;
            if (v <= 2) return `{soft|${hourText}}`;
            if (v <= 4) return `{mid|${hourText}}`;
            return `{light|${hourText}}`;
          },
          rich: {
            soft: {
              color: '#4b5563',
              fontSize: 12,
              fontWeight: 700
            },
            mid: {
              color: '#1f2937',
              fontSize: 12,
              fontWeight: 700
            },
            light: {
              color: 'rgba(255,255,255,0.92)',
              fontSize: 12,
              fontWeight: 700,
              textShadowColor: 'rgba(15, 23, 42, 0.18)',
              textShadowBlur: 6
            }
          }
        },
        itemStyle: {
          borderWidth: 3,
          borderColor: 'rgba(255,255,255,0.95)',
          borderRadius: 7,
          shadowBlur: 0,
          shadowColor: 'rgba(15, 23, 42, 0.08)'
        },
        emphasis: {
          itemStyle: {
            borderColor: '#0f172a',
            borderWidth: 2,
            shadowBlur: 18,
            shadowColor: 'rgba(15, 23, 42, 0.18)'
          }
        }
      }]
    };

    function renderContribChart() {
      const width = contribEl.clientWidth || 960;
      const height = contribEl.clientHeight || 420;
      const leftPadding = 64;
      const rightPadding = 18;
      const topPadding = 40;
      const bottomPadding = 20;
      const plotMaxWidth = Math.max(0, width - leftPadding - rightPadding);
      const plotMaxHeight = Math.max(0, height - topPadding - bottomPadding);
      const cellSize = Math.max(10, Math.floor(Math.min(plotMaxWidth / weeks.length, plotMaxHeight / ylabels.length)));
      const gridWidth = cellSize * weeks.length;
      const gridHeight = cellSize * ylabels.length;
      const gridLeft = leftPadding + Math.max(0, Math.floor((plotMaxWidth - gridWidth) / 2));
      const gridTop = topPadding + Math.max(0, Math.floor((plotMaxHeight - gridHeight) / 2));
      contribChart.setOption({
        ...contribBaseOption,
        grid: {
          left: gridLeft,
          top: gridTop,
          width: gridWidth,
          height: gridHeight,
          containLabel: false
        }
      });
    }

    renderContribChart();

    const trendLabels = __TREND_LABELS_JSON__;
    const trendValues = __TREND_VALUES_JSON__;
    const trendTokenValues = __TREND_TOKEN_VALUES_JSON__;
    const trendDates = __TREND_DATES_JSON__;
    const trendWeekdays = __TREND_WEEKDAYS_JSON__;
    const trendSeriesData = trendValues.map((value, index) => ({
      value,
      date: trendDates[index],
      weekday: trendWeekdays[index]
    }));
    const trendTokenSeriesData = trendTokenValues.map((value, index) => ({
      value,
      date: trendDates[index],
      weekday: trendWeekdays[index]
    }));

    barsChart.setOption({
      legend: {
        top: 0,
        right: 20,
        data: ['工作时长', 'Token 用量']
      },
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'line',
          snap: true
        },
        formatter: (params) => {
          const items = params || [];
          const item = items.length ? items[0] : null;
          if (!item) return '';
          const data = item.data || {};
          const date = data.date || trendDates[item.dataIndex] || item.axisValue;
          const weekday = data.weekday || trendWeekdays[item.dataIndex] || '';
          const lines = items.map((entry) => {
            const value = typeof entry.data.value === 'number' ? entry.data.value : entry.value;
            const suffix = entry.seriesName === 'Token 用量' ? '' : 'h';
            const displayValue = entry.seriesName === 'Token 用量' ? formatTokenCount(value) : value;
            return `${entry.marker}${entry.seriesName}: ${displayValue}${suffix}`;
          });
          return `${date} ${weekday}<br/>${lines.join('<br/>')}`;
        }
      },
      grid: { top: 28, left: 50, right: 58, bottom: 50 },
      xAxis: {
        type: 'category',
        data: trendLabels,
        boundaryGap: false,
        axisLabel: {
          interval: Math.max(0, Math.floor(trendLabels.length / 10) - 1),
          fontSize: 12
        }
      },
      yAxis: [
        {
          type: 'value',
          min: 0,
          max: __TREND_Y_MAX__,
          axisLabel: {
            formatter: '{value}h',
            fontSize: 12
          },
          splitLine: {
            lineStyle: {
              color: '#e5e7eb'
            }
          }
        },
        {
          type: 'value',
          min: 0,
          axisLabel: {
            formatter: (value) => formatTokenCount(value),
            fontSize: 12
          },
          splitLine: {
            show: false
          }
        }
      ],
      series: [{
        name: '工作时长',
        type: 'line',
        smooth: true,
        data: trendSeriesData,
        triggerLineEvent: true,
        showSymbol: true,
        symbol: 'circle',
        symbolSize: 8,
        lineStyle: { color: '#31a354', width: 3 },
        itemStyle: { color: '#31a354' },
        emphasis: {
          focus: 'series',
          scale: true
        },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(49, 163, 84, 0.35)' },
            { offset: 1, color: 'rgba(49, 163, 84, 0.05)' }
          ])
        }
      }, {
        name: 'Token 用量',
        type: 'line',
        yAxisIndex: 1,
        smooth: true,
        data: trendTokenSeriesData,
        showSymbol: true,
        symbol: 'circle',
        symbolSize: 7,
        lineStyle: { color: '#db2777', width: 2.5 },
        itemStyle: { color: '#db2777' },
        emphasis: {
          focus: 'series',
          scale: true
        }
      }]
    });

    window.addEventListener('resize', () => {
      contribChart.resize();
      renderContribChart();
      barsChart.resize();
    });
  </script>
</body>
</html>
